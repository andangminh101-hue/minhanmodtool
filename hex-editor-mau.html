<body>
<div class="container">
  <div class="panel">
    <div class="header-title">Make Tự Động [<span class="rainbow">Minh An Mod</span>]</div>
    <input type="file" id="fileInput" style="width:100%;">
    <div class="status-bar" id="fileInfo">Trạng thái: Chưa chọn file.</div>
  </div>

  <div class="panel">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Tìm Hex (VD: 486578) hoặc Text...">
      <button id="searchBtn">Tìm Kiếm</button>
    </div>
    <div class="edit-box">
      <input type="text" id="targetInput" placeholder="Giá trị cũ">
      <input type="text" id="replaceInput" placeholder="Giá trị mới">
      <button id="replaceBtn">Thay Thế</button>
    </div>
  </div>

  <div class="panel" style="padding:4px;">
    <div class="table-container" id="tableBox">
      <table class="hex-table">
        <thead><tr><th class="col-offset">Offset</th><th class="col-hex">Bytes (00–0F)</th><th class="col-ascii">ASCII Text</th></tr></thead>
        <tbody id="hexTableBody"><tr><td colspan="3" style="text-align:center;color:#6b7280;padding:25px;">Đang chờ nạp dữ liệu tệp tin...</td></tr></tbody>
      </table>
    </div>
    <div class="pager"><button id="prevBtn" disabled>« Trang trước</button><button id="nextBtn" disabled>Trang sau »</button></div>
    <div class="status-bar" id="pageInfo"></div>
  </div>

  <div class="panel">
    <button id="downloadBtn" style="width:100%;" disabled>Tải Xuống File Đã Sửa</button>
  </div>
</div>

<div class="footer-credit">Tool Make tự động
  <div class="footer-buttons">
    <a href="https://zalo.me/0325409177" target="_blank" rel="noopener" class="btn-link">Chat Zalo</a>
    <a href="https://t.me/dangminhan209" target="_blank" rel="noopener" class="btn-link">Chat Telegram</a>
  </div>
</div>

<script>
let u8=null,fileName="edited_file.bin",lastFound=-1,lastLen=0,pageStart=0;
const ROWS=500,BPR=16,$=id=>document.getElementById(id);

$("fileInput").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  fileName=f.name;
  const r=new FileReader();
  r.onload=ev=>{
    u8=new Uint8Array(ev.target.result);
    $("fileInfo").textContent="File: "+f.name+" | Kích thước: "+u8.length+" bytes";
    lastFound=-1;lastLen=0;pageStart=0;$("downloadBtn").disabled=false;render();
  };
  r.readAsArrayBuffer(f);
});

function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function render(){
  if(!u8)return;
  const total=Math.ceil(u8.length/BPR);
  const from=pageStart,to=Math.min(total,from+ROWS);
  let html="";
  for(let row=from;row<to;row++){
    const i=row*BPR;let hx="",as="";
    for(let j=0;j<BPR;j++){
      const k=i+j;
      if(k<u8.length){
        const b=u8[k],h=b.toString(16).padStart(2,"0").toUpperCase();
        const hl=lastFound!==-1&&k>=lastFound&&k<lastFound+lastLen;
        hx+='<span class="hex-byte'+(hl?" highlight":"")+'" data-index="'+k+'">'+h+"</span>";
        as+=(b>=32&&b<=126)?String.fromCharCode(b):".";
      }else{hx+='<span class="hex-byte" style="visibility:hidden">00</span>';as+=" "}
    }
    html+='<tr><td class="col-offset">0x'+i.toString(16).padStart(6,"0").toUpperCase()+'</td><td class="col-hex">'+hx+'</td><td class="col-ascii">'+esc(as)+"</td></tr>";
  }
  $("hexTableBody").innerHTML=html;
  $("prevBtn").disabled=from===0;$("nextBtn").disabled=to>=total;
  $("pageInfo").textContent="Hiển thị dòng "+(from+1)+"–"+to+" / "+total+". Chạm vào một byte để sửa.";
}

$("hexTableBody").addEventListener("click",e=>{
  const el=e.target.closest(".hex-byte[data-index]");if(!el||!u8)return;
  const idx=parseInt(el.dataset.index);
  const v=prompt("Sửa byte tại 0x"+idx.toString(16).toUpperCase()+" (Hex 00-FF):",el.textContent);
  if(v===null||v.trim()==="")return;
  const p=parseInt(v.trim(),16);
  if(!isNaN(p)&&p>=0&&p<=255){u8[idx]=p;render()}else alert("Giá trị Hex không hợp lệ!");
});

$("prevBtn").onclick=()=>{pageStart=Math.max(0,pageStart-ROWS);render();$("tableBox").scrollTop=0};
$("nextBtn").onclick=()=>{pageStart+=ROWS;render();$("tableBox").scrollTop=0};

function toBytes(str){
  const c=str.replace(/\s+/g,"");
  if(/^[0-9A-Fa-f]+$/.test(c)&&c.length%2===0){
    const o=[];for(let i=0;i<c.length;i+=2)o.push(parseInt(c.substr(i,2),16));return o;
  }
  return Array.from(new TextEncoder().encode(str));
}
function findFrom(pat,start){
  for(let i=start;i<=u8.length-pat.length;i++){
    let ok=true;
    for(let j=0;j<pat.length;j++)if(u8[i+j]!==pat[j]){ok=false;break}
    if(ok)return i;
  }
  return -1;
}

$("searchBtn").onclick=()=>{
  if(!u8)return;
  const q=$("searchInput").value.trim();if(!q)return;
  const pat=toBytes(q);
  let at=findFrom(pat,lastFound===-1?0:lastFound+1);
  if(at===-1&&lastFound!==-1)at=findFrom(pat,0);
  if(at===-1){alert("Không tìm thấy kết quả khớp.");return}
  lastFound=at;lastLen=pat.length;
  pageStart=Math.max(0,Math.floor(at/BPR)-5);
  render();
  const row=Math.floor(at/BPR)-pageStart;
  $("tableBox").scrollTop=Math.max(0,row*25-50);
};

$("replaceBtn").onclick=()=>{
  if(!u8)return;
  const t=$("targetInput").value.trim(),r=$("replaceInput").value.trim();
  if(!t||!r){alert("Vui lòng nhập đầy đủ giá trị cũ và mới.");return}
  const tb=toBytes(t),rb=toBytes(r);
  if(tb.length!==rb.length){alert("Độ dài giá trị cũ và mới phải bằng nhau để tránh làm hỏng cấu trúc file.");return}
  let n=0;
  for(let i=0;i<=u8.length-tb.length;i++){
    let ok=true;
    for(let j=0;j<tb.length;j++)if(u8[i+j]!==tb[j]){ok=false;break}
    if(ok){for(let j=0;j<rb.length;j++)u8[i+j]=rb[j];n++;i+=tb.length-1}
  }
  if(n>0){alert("Đã thay thế thành công "+n+" vị trí.");render()}else alert("Không tìm thấy chuỗi dữ liệu cần thay thế.");
};

$("downloadBtn").onclick=()=>{
  if(!u8)return;
  const url=URL.createObjectURL(new Blob([u8],{type:"application/octet-stream"}));
  const a=document.createElement("a");a.href=url;a.download=fileName;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1500);
};
</script>
</body>
</html>
